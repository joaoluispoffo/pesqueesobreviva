<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Front End</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f6f8; --card: #fff; --fg: #1d2330; --muted: #5d6677; --ok: #1f9d55; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14171d; --card: #1d2129; --fg: #e8ebf0; --muted: #9aa3b2; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           color: var(--fg); font-family: system-ui, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    .card { background: var(--card); border-radius: 12px; padding: 32px; max-width: 520px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .status { color: var(--ok); font-weight: 600; }
    p, li { color: var(--muted); line-height: 1.5; }
    code { background: rgba(127,127,127,.15); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Server Front End</h1>
    <p class="status">● Servidor no ar</p>
    <p>Substitua o conteúdo da pasta <code>www</code> pelos arquivos do seu frontend
       (por exemplo, a pasta <code>dist</code> ou <code>build</code> do seu projeto).</p>
    <p>Horário do navegador: <span id="t"></span></p>
  </main>
  <script>document.getElementById('t').textContent = new Date().toLocaleString('pt-BR');</script>
</body>
</html>
